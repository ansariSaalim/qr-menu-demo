<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labbaik Chicken Crunch – Order Online</title>
<meta name="theme-color" content="#c8102e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c8102e; --red-d:#9b0c23; --yellow:#ffd60a; --yellow-d:#f4b400;
  --ink:#1d1d1f; --muted:#6b6b70; --bg:#fff8ec; --card:#ffffff; --line:#f0e3cc;
  --green:#25d366; --green-d:#128c7e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins','Noto Sans Gujarati',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
body.gu .item-name,body.gu .cat-title{font-family:'Noto Sans Gujarati','Poppins',sans-serif}
button{font-family:inherit;cursor:pointer;border:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;pointer-events:none}


/* Header */
.hero{background:linear-gradient(160deg,var(--red) 0%,var(--red-d) 100%);color:#fff;padding:18px 18px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--yellow);opacity:.18}
.top-row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.halal{background:#fff;color:#0a7a3a;font-weight:700;font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.lang{background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px}
.brand{font-family:'Bungee',sans-serif;font-size:30px;line-height:1.05;margin-top:14px;color:var(--yellow);text-shadow:2px 2px 0 #6d0715;position:relative;z-index:1}
.brand span{display:block;font-size:40px}
.pitch{font-family:'Poppins',sans-serif;font-weight:700;font-size:21px;line-height:1.25;margin-top:12px;position:relative;z-index:1;color:#fff}
.party{max-width:688px;margin:28px auto 0;margin-left:16px;margin-right:16px;background:linear-gradient(150deg,#ffd60a,#ffb703);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 6px 20px rgba(244,180,0,.3);scroll-margin-top:120px}
@media(min-width:720px){.party{margin-left:auto;margin-right:auto}}
.party-em{font-size:34px}
.party h3{font-family:'Noto Sans Gujarati','Poppins',sans-serif;font-size:20px;color:var(--red-d);margin-top:4px;line-height:1.35}
.party-en{font-weight:700;font-size:14.5px;margin-top:6px}
.party-sub{font-size:12.5px;color:#5a4500;margin-top:6px}
.party-btn{margin-top:14px;background:var(--red);color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border-radius:14px}
.madeby{margin-top:14px;font-size:12.5px;color:var(--muted)}
.madeby a{color:var(--red);font-weight:700;text-decoration:none}
.tag{margin-top:8px;font-size:13px;opacity:.92;position:relative;z-index:1}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.pill{background:var(--yellow);color:var(--ink);font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px}
.pill.ghost{background:rgba(255,255,255,.15);color:#fff}
.pill a{color:inherit;text-decoration:none}

/* Search + tabs */
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.search{margin:0 16px 10px;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:none;outline:none;padding:11px 8px;font-size:15px;font-family:inherit;background:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;padding:8px 14px;border-radius:22px;white-space:nowrap}
.tab.active{background:var(--red);border-color:var(--red);color:#fff}

/* Menu */
main{max-width:720px;margin:0 auto;padding:6px 16px}
.cat{margin-top:22px;scroll-margin-top:118px}
.cat-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin-bottom:10px}
.cat-title .em{font-size:22px}
.cat-title .count{font-size:12px;font-weight:500;color:var(--muted)}
.item{background:var(--card);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(155,12,35,.05)}
.item .info{flex:1;min-width:0}
.thumb{width:76px;height:76px;flex:0 0 76px;border-radius:14px;object-fit:cover;background:#ffe9b0 center/40% no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px}
.item{align-items:center}
@media(max-width:360px){.thumb{width:64px;height:64px;flex-basis:64px}}
.photo-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
.item-name{font-size:15px;font-weight:600;line-height:1.3}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.price{font-size:15px;font-weight:700;color:var(--red);margin-top:4px}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
.add{background:#fff;color:var(--red);border:1.8px solid var(--red);font-weight:700;font-size:14px;padding:8px 20px;border-radius:12px;min-width:92px}
.add:active{transform:scale(.96)}
.qty{display:flex;align-items:center;background:var(--red);border-radius:12px;overflow:hidden;min-width:92px;justify-content:space-between}
.qty button{background:transparent;color:#fff;font-size:20px;font-weight:700;width:32px;height:38px}
.qty span{color:#fff;font-weight:700;font-size:15px;min-width:22px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:40px 0}

footer{max-width:720px;margin:30px auto 0;padding:20px 16px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink)}

/* Cart bar */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;background:var(--red);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(155,12,35,.35);transform:translateY(150%);transition:transform .25s ease;z-index:30}
.cartbar.show{transform:none}
.cartbar .l{font-size:12px;opacity:.9}
.cartbar .t{font-size:17px;font-weight:700}
.cartbar button{background:var(--yellow);color:var(--ink);font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease;z-index:50;padding:8px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.grab{width:44px;height:5px;background:#ddd;border-radius:4px;margin:6px auto 12px}
.sheet h2{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.close{background:#f3f3f3;width:34px;height:34px;border-radius:50%;font-size:18px}
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line .n{flex:1;font-size:14px;font-weight:500}
.line .p{font-size:14px;font-weight:700;min-width:60px;text-align:right}
.line .qty{min-width:86px}
.line .qty button{height:32px}
.totals{margin:14px 0 4px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .grand{font-size:18px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.note{background:#fff6d6;border:1px solid #ffe58a;color:#6a5200;font-size:12.5px;padding:9px 12px;border-radius:10px;margin:10px 0}
.note.err{background:#ffe9ec;border-color:#ffb8c3;color:var(--red-d)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input.f,textarea.f{width:100%;border:1.5px solid #e4e4e4;border-radius:12px;padding:12px;font-size:15px;font-family:inherit;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--red)}
textarea.f{resize:vertical;min-height:64px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:#f6f6f6;border:1.8px solid #f6f6f6;padding:12px 8px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink)}
.seg button.on{background:#fff2f4;border-color:var(--red);color:var(--red)}
.seg small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.wa{width:100%;margin-top:18px;background:var(--green);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.wa:disabled{background:#b8b8b8}
.wa svg{width:22px;height:22px}
.locbtn{width:100%;margin-top:10px;background:#fff;border:1.8px dashed var(--red);color:var(--red);font-weight:600;font-size:14px;padding:11px;border-radius:12px}
.tick{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:13px;margin-top:10px}
.tick input{margin-top:3px;width:18px;height:18px;accent-color:var(--red)}
.note.ok{background:#e8f8ee;border-color:#a8e2bd;color:#0a6b33}
.hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-120px);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;transition:transform .25s;z-index:60}
.toast.show{transform:translate(-50%,0)}
.mapbox{display:none;margin-top:10px}
.mapbox.show{display:block}
#map{height:220px;border-radius:14px;border:1.5px solid var(--line);overflow:hidden;z-index:0}
.maphint{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:center}
.upi-card{margin-top:12px;border:1.5px solid #d8ecdf;background:#f4fbf6;border-radius:14px;padding:14px;text-align:center}
.upi-amt{font-weight:700;font-size:15px}
.upi-btn{width:100%;margin-top:10px;background:#5f259f;color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:12px}
.upi-qr{margin:12px auto 4px;width:176px;height:176px;background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.upi-qr svg,.upi-qr img{width:100%;height:100%;display:block}
.upi-id{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-size:13.5px}
.upi-id code{background:#fff;border:1px solid #e2e2e2;border-radius:8px;padding:5px 9px;font-weight:600}
.upi-id button{background:#fff;border:1px solid var(--red);color:var(--red);font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px}
.upi-card .tick{justify-content:center;margin-top:12px;font-weight:600}
.ss-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;align-items:flex-end;justify-content:center}
.ss-ov.show{display:flex}
.ss-box{background:#fff;border-radius:22px 22px 0 0;max-width:720px;width:100%;padding:22px 18px calc(20px + env(safe-area-inset-bottom));text-align:center}
.ss-box h3{font-size:19px;margin-bottom:8px}
.ss-box p{font-size:14px;color:var(--muted);line-height:1.5}
.ss-steps{text-align:left;background:#fff8ec;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13.5px;line-height:1.7}
.ss-box .wa{margin-top:10px}
.ss-sec{width:100%;margin-top:8px;background:#fff;border:1.5px solid #ddd;color:var(--ink);font-weight:600;font-size:15px;padding:12px;border-radius:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>

</head>
<body>

<header class="hero">
  <div class="top-row">

const GU_DIGITS = "૦૧૨૩૪૫૬૭૮૯";
const gd = x => lang==="gu" ? String(x).replace(/[0-9]/g, d=>GU_DIGITS[d]) : String(x);
const t = (k,...a) => { const v = T[lang][k]; return typeof v==="function" ? v(...a) : v; };
function applyLang(){
  document.documentElement.lang = lang==="gu" ? "gu" : "en";
  document.body.classList.toggle("gu", lang==="gu");
  document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML = t(el.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder = t(el.dataset.ph));
  document.getElementById("waTxt").textContent = t("waSend");
  const lb=document.getElementById("locBtn"); lb.textContent = loc && !loc.failed ? t("useLocAgain") : (loc && loc.failed ? t("tryAgain") : t("useLoc"));
}

const CART_TTL = 30*60*1000;   // keep an unfinished cart for 30 minutes only
try{
  const saved = JSON.parse(localStorage.getItem("lcc_cart")||"{}");
  if(saved.t && Date.now()-saved.t < CART_TTL && saved.items){ cart = saved.items; }
  else { cart = {}; localStorage.removeItem("lcc_cart"); }
  Object.keys(cart).forEach(k=>{if(!ITEMS[k]) delete cart[k]});
}catch(e){ cart = {}; }
const save = ()=>{ try{
  if(Object.keys(cart).length) localStorage.setItem("lcc_cart", JSON.stringify({t:Date.now(), items:cart}));
  else localStorage.removeItem("lcc_cart");
}catch(e){} };
// always open at the top of the menu
try{ history.scrollRestoration = "manual"; }catch(e){}
window.addEventListener("load", ()=>window.scrollTo(0,0));
window.addEventListener("pageshow", e=>{ if(e.persisted) window.scrollTo(0,0); });
const rs = n => "₹" + gd(n.toLocaleString("en-IN"));
const nm = it => lang==="gu" ? it.gu : it.en;

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let html = "", tabs = "", any = false;
  MENU.forEach(c=>{
    const list = c.items.map(a=>ITEMS[a[0]]).filter(it=>!q || it.en.toLowerCase().includes(q) || it.gu.includes(q) || c.en.toLowerCase().includes(q) || c.gu.includes(q));
    if(!list.length) return;
    any = true;
    tabs += `<button class="tab" data-c="${c.id}" onclick="jump('${c.id}')">${c.em} ${lang==="gu"?c.gu:c.en}</button>`;
    html += `<section class="cat" id="c-${c.id}"><h2 class="cat-title"><span class="em">${c.em}</span>${lang==="gu"?c.gu:c.en}<span class="count">· ${gd(list.length)}</span></h2>`;
    list.forEach(it=>{
      const qn = cart[it.id]||0;
      const u = imgUrl(it.id);
      html += `<div class="item">${u ? `<img class="thumb" src="${u}" alt="${it.en}" loading="lazy" onerror="this.outerHTML='<div class=&quot;thumb&quot;>${c.em}</div>'">` : `<div class="thumb">${c.em}</div>`}<div class="info">
        <div class="item-name">${nm(it)}${it.sp?'<span class="badge">'+t("special")+'</span>':''}</div>
        <div class="price">${rs(it.price)}</div></div>
        ${qn ? `<div class="qty"><button onclick="chg('${it.id}',-1)">−</button><span>${gd(qn)}</span><button onclick="chg('${it.id}',1)">+</button></div>`
             : `<button class="add" onclick="chg('${it.id}',1)">${t("add")}</button>`}
      </div>`;
    });
    html += `</section>`;
  });
  document.getElementById("menu").innerHTML = any ? html : `<p class="empty">${t("noMatch", q.replace(/</g,"&lt;"))}</p>`;
  document.getElementById("tabs").innerHTML = tabs;
  updateBar(); spy();
}

function chg(id,d){
  cart[id] = (cart[id]||0) + d;
  if(cart[id] <= 0) delete cart[id];
  if(d>0 && cart[id]===1) toast(t("added", nm(ITEMS[id])));
  save(); render();
  if(document.getElementById("sheet").classList.contains("show")) renderSheet();
}

function totals(){
  let count=0, sub=0;
  for(const id in cart){ count+=cart[id]; sub+=cart[id]*ITEMS[id].price; }
  return {count, sub};
}

function updateBar(){
  const {count, sub} = totals();
  document.getElementById("cbCount").textContent = gd(t("items", count));
  document.getElementById("cbTotal").textContent = rs(sub);
  document.getElementById("cartbar").classList.toggle("show", count>0);
}

function jump(id){ document.getElementById("c-"+id).scrollIntoView({behavior:"smooth"}); }
function spy(){
  let cur = null;
  document.querySelectorAll(".cat").forEach(s=>{ if(s.getBoundingClientRect().top < 150) cur = s.id.slice(2); });
  document.querySelectorAll(".tab").forEach(t=>{
    const on = t.dataset.c === (cur || MENU[0].id);
    if(on && !t.classList.contains("active")) t.scrollIntoView({inline:"center",block:"nearest"});
    t.classList.toggle("active", on);
  });
}
window.addEventListener("scroll", spy, {passive:true});

const sheetOpen = () => document.getElementById("sheet").classList.contains("show");
function showSheet(){ renderSheet(); document.getElementById("overlay").classList.add("show"); document.getElementById("sheet").classList.add("show"); }
function hideSheet(){ document.getElementById("overlay").classList.remove("show"); document.getElementById("sheet").classList.remove("show"); }
function openSheet(){ if(sheetOpen()) return; showSheet(); try{ history.pushState({sheet:1}, ""); }catch(e){} }
function closeSheet(){
  if(!sheetOpen()) return;
  if(history.state && history.state.sheet){ history.back(); }   // popstate will hide it
  else hideSheet();
}

/* Android back button: close cart first, then "press back again to exit" */
let lastBack = 0;
try{
  history.replaceState({base:1}, "");
  history.pushState({guard:1}, "");
}catch(e){}
window.addEventListener("popstate", e => {
  if(sheetOpen()){ hideSheet(); return; }
  if(e.state && e.state.base){
    if(Date.now() - lastBack < 2000){ history.back(); return; }
    lastBack = Date.now();
    toast(t("backExit"));
    try{ history.pushState({guard:1}, ""); }catch(err){}
  }
});

function setPay(m){
  payMode = m;
  document.getElementById("pUpi").classList.toggle("on", m==="upi");
  document.getElementById("pCash").classList.toggle("on", m==="cash");
  document.getElementById("upiBox").style.display = m==="upi" ? "" : "none";
  renderSheet();
}
const upiLink = (amt, note) => `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(UPI_NAME)}&am=${amt.toFixed(2)}&cu=INR&tn=${encodeURIComponent(note)}`;
let qrFor = "";
function drawQr(link){
  if(qrFor===link) return; qrFor = link;
  const box = document.getElementById("upiQr");
  try{ const q = qrcode(0,"M"); q.addData(link); q.make(); box.innerHTML = q.createSvgTag({cellSize:4, margin:0, scalable:true}); box.style.display=""; }
  catch(e){ box.style.display="none"; qrFor=""; }
}
function payUpi(){
  const {sub} = totals();
  window.location.href = upiLink(sub, "Labbaik order");
  setTimeout(()=>toast(t("noUpiApp")), 2500);
}
function copyUpi(){
  const done=()=>toast(t("copied"));
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(UPI_ID).then(done,done); else done();
}

function setType(t){
  orderType = t;
  document.getElementById("tDel").classList.toggle("on", t==="delivery");
  document.getElementById("tPick").classList.toggle("on", t==="pickup");
  document.getElementById("addrWrap").style.display = t==="delivery" ? "" : "none";
  renderSheet();
}

function renderSheet(){
  const {count, sub} = totals();
  if(!count){ closeSheet(); return; }
  document.getElementById("lines").innerHTML = Object.keys(cart).map(id=>{
    const it = ITEMS[id];
    return `<div class="line"><div class="n">${nm(it)}<div class="item-sub">${t("each", rs(it.price))}</div></div>
      <div class="qty"><button onclick="chg('${id}',-1)">−</button><span>${gd(cart[id])}</span><button onclick="chg('${id}',1)">+</button></div>
      <div class="p">${rs(it.price*cart[id])}</div></div>`;
  }).join("");
  document.getElementById("totals").innerHTML =
    `<div><span>${gd(t("itemsN",count))}</span><span>${rs(sub)}</span></div>
     <div><span>${t("delivery")}</span><span>${orderType==="delivery" ? t("free") : "—"}</span></div>
     <div class="grand"><span>${t("total")}</span><span>${rs(sub)}</span></div>`;
  const short = MIN_DELIVERY - sub;
  const far = orderType==="delivery" && loc && loc.km > MAX_KM;
  const unverified = orderType==="delivery" && (!loc || loc.failed) && !(loc && loc.failed && document.getElementById("tick").checked);
  const blocked = orderType==="delivery" && (short>0 || far || unverified);
  let mn = "";
  if(orderType==="delivery"){
    if(short > 0) mn = `<div class="note err">${t("minNote", rs(MIN_DELIVERY), rs(short))}</div>`;
    else if(!far) mn = `<div class="note">${t("qualifies")}${unverified ? t("tapLoc") : "!"}</div>`;
  }
  document.getElementById("minNote").innerHTML = mn;
  // UPI
  document.getElementById("upiBox").style.display = payMode==="upi" ? "" : "none";
  document.getElementById("upiAmt").innerHTML = t("upiAmt", rs(sub));
  document.getElementById("upiBtn").textContent = t("upiBtn", rs(sub));
  document.getElementById("paidTxt").textContent = t("paidTick", rs(sub));
  document.getElementById("upiId").textContent = UPI_ID;
  if(payMode==="upi") drawQr(upiLink(sub, "Labbaik order"));
  const unpaid = payMode==="upi" && !document.getElementById("paidTick").checked;
  document.getElementById("waBtn").disabled = blocked || unpaid;
  document.getElementById("waTxt").textContent = (orderType==="delivery" && !far && short<=0 && unverified) ? t("waCheck") : unpaid && !blocked ? t("waPayFirst") : t("waSend");
}

function distKm(a,b){
  const R=6371, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
let map=null, pin=null, geoTimer=null;
function showLoc(){
  const n=document.getElementById("locNote"), b=document.getElementById("locBtn");
  document.getElementById("tickWrap").style.display = (loc && loc.failed) ? "" : "none";
  if(!loc){ n.innerHTML=""; return; }
  if(loc.failed){ n.innerHTML=`<div class="note">${t("locFailed")}</div>`; b.textContent=t("tryAgain"); return; }
  b.textContent=t("useLocAgain");
  n.innerHTML = loc.km <= MAX_KM
    ? `<div class="note ok">${t("near", gd(loc.km.toFixed(1)))}</div>`
    : `<div class="note err">${t("far", gd(loc.km.toFixed(1)), gd(MAX_KM))}</div>`;
}
function setPoint(lat,lng,src){
  loc = {lat, lng, km: distKm(SHOP,{lat,lng}), src};
  showLoc(); renderSheet(); fillAddress(lat,lng);
}
function fillAddress(lat,lng){
  clearTimeout(geoTimer);
  geoTimer = setTimeout(async ()=>{
    const a=document.getElementById("addr");
    if(a.value.trim() && a.dataset.auto!=="1") return;   // never overwrite what the customer typed
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&accept-language=en`);
      const j = await r.json();
      if(j && j.display_name){
        a.value = j.display_name.replace(/, \d{6}/,"").replace(/, India$/,"").split(", ").slice(0,5).join(", ");
        a.dataset.auto = "1";
        toast(t("addrFilled"));
      }
    }catch(e){}
  }, 600);
}
function showMap(lat,lng){
  if(typeof L === "undefined") return false;
  document.getElementById("mapbox").classList.add("show");
  if(!map){
    map = L.map("map",{zoomControl:true, attributionControl:true}).setView([lat,lng],16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
    L.circle([SHOP.lat,SHOP.lng],{radius:MAX_KM*1000,color:"#c8102e",weight:1.5,fillOpacity:.05}).addTo(map);
    L.circleMarker([SHOP.lat,SHOP.lng],{radius:7,color:"#fff",weight:2,fillColor:"#f4b400",fillOpacity:1}).addTo(map).bindTooltip("Labbaik Chicken Crunch");
    pin = L.marker([lat,lng],{draggable:true}).addTo(map);
    pin.on("dragend",()=>{ const p=pin.getLatLng(); setPoint(p.lat,p.lng,"pin"); });
    map.on("click",e=>{ pin.setLatLng(e.latlng); setPoint(e.latlng.lat,e.latlng.lng,"pin"); });
  } else { map.setView([lat,lng],16); pin.setLatLng([lat,lng]); }
  setTimeout(()=>map.invalidateSize(),150);
  return true;
}
function checkLocation(){
  const b=document.getElementById("locBtn");
  if(!navigator.geolocation){ gpsFailed(); return; }
  b.textContent=t("finding");
  navigator.geolocation.getCurrentPosition(p=>{
    showMap(p.coords.latitude,p.coords.longitude);
    setPoint(p.coords.latitude,p.coords.longitude,"gps");
  }, gpsFailed, {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function gpsFailed(){
  // No GPS: let them place the pin themselves, starting at the shop
  if(showMap(SHOP.lat,SHOP.lng)){
    loc=null; showLoc();
    document.getElementById("locNote").innerHTML=`<div class="note">${t("noGps")}</div>`;
    document.getElementById("locBtn").textContent=t("gpsAgain");
    renderSheet();
  } else { loc={failed:true}; showLoc(); renderSheet(); }
}

function sendOrder(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.replace(/[૦-૯]/g,d=>GU_DIGITS.indexOf(d)).replace(/\D/g,"");
  const addr = document.getElementById("addr").value.trim();
  const notes = document.getElementById("notes").value.trim();
  const {count, sub} = totals();
  if(!count) return;
  if(orderType==="delivery" && sub < MIN_DELIVERY) return toast(t("tMin"));
  if(orderType==="delivery" && loc && loc.km > MAX_KM) return toast(t("tFar"));
  if(!name) return toast(t("tName")), document.getElementById("name").focus();
  if(phone.length !== 10) return toast(t("tPhone")), document.getElementById("phone").focus();
  if(orderType==="delivery" && addr.length < 8) return toast(t("tAddr")), document.getElementById("addr").focus();
  if(payMode==="upi" && !document.getElementById("paidTick").checked) return toast(t("tPaid"));

  const d = new Date();
  const oid = "LCC" + String(d.getDate()).padStart(2,"0") + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0") + Math.floor(Math.random()*90+10);
  let msg = `🍗 *NEW ORDER – Labbaik Chicken Crunch*\n`;
  msg += `Order ID: *${oid}*\n`;
  msg += `Type: *${orderType==="delivery" ? "🛵 Home Delivery" : "🏃 Pickup / Dine-in"}*\n\n`;
  Object.keys(cart).forEach((id,i)=>{
    const it = ITEMS[id];
    msg += `${i+1}. ${it.en} × ${cart[id]} = ₹${it.price*cart[id]}\n`;
  });
  msg += `\n*Total: ₹${sub}*${orderType==="delivery" ? " (Free delivery)" : ""}\n`;
  if(payMode==="upi") msg += `💳 Payment: *UPI ₹${sub} – paid by customer*\nTo: ${UPI_ID}\n📸 Payment screenshot: sending next in this chat\n⚠️ Please check the screenshot / your UPI app before preparing.\n\n`;
  else msg += `💵 Payment: *Cash on ${orderType==="delivery" ? "delivery" : "pickup"}*\n\n`;
  msg += `👤 ${name}\n📞 ${phone}\n`;
  if(orderType==="delivery") msg += `📍 ${addr}\n`;
  if(orderType==="delivery" && loc && !loc.failed) msg += `🗺️ ${loc.src==="pin"?"Pinned":"GPS"} location (${loc.km.toFixed(1)} km): https://maps.google.com/?q=${loc.lat.toFixed(6)},${loc.lng.toFixed(6)}\n`;
  if(orderType==="delivery" && loc && loc.failed) msg += `⚠️ Location not shared — customer confirmed within 3 km\n`;
  if(notes) msg += `📝 ${notes}\n`;

  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  const paidUpi = payMode==="upi";
  cart = {}; save(); render(); closeSheet();
  document.getElementById("paidTick").checked = false;
  toast(t("tSent"));
  if(paidUpi){ lastOid = oid; openSs(); }
}

/* After a UPI order: ask for the payment screenshot */
function openSs(){
  document.getElementById("ssText").innerHTML = t("ssText", lastOid);
  document.getElementById("ssOv").classList.add("show");
}
function closeSs(){ document.getElementById("ssOv").classList.remove("show"); }
function openChat(){
  toast(t("ssManual"));
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("📸 Payment screenshot for order " + lastOid)}`, "_blank");
}
function pickShot(){
  // Phones that can share files: pick the screenshot here and share it straight to WhatsApp.
  const probe = typeof File!=="undefined" ? new File([""], "x.png", {type:"image/png"}) : null;
  if(navigator.canShare && probe && navigator.canShare({files:[probe]})) document.getElementById("ssFile").click();
  else openChat();
}
async function shareShot(file){
  if(!file) return;
  try{
    await navigator.share({files:[file], text:"📸 Payment screenshot for order " + lastOid + " – Labbaik Chicken Crunch"});
    closeSs();
  }catch(e){ if(e && e.name!=="AbortError") openChat(); }
}

function partyEnquiry(){
  const msg = "🎉 *Party / Function Order Enquiry – Labbaik Chicken Crunch*\n\nOccasion: \nDate: \nTime: \nNumber of people: \nItems wanted: \nDelivery address (if any): \n\n(શુભ પ્રસંગ માટે ઓર્ડર)";
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}

function toggleLang(){
  lang = lang==="en" ? "gu" : "en";
  try{ localStorage.setItem("lcc_lang", lang); }catch(e){}
  applyLang(); render();
  if(sheetOpen()){ renderSheet(); showLoc(); }
}

let tt;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1600); }

applyLang();
render();
</script>
</body>
